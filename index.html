<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>电客车能耗数据批量录入</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1668dc">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"Microsoft YaHei",sans-serif;margin:0;padding:10px 10px 76px;background:#eef1f5;color:#222}
  h3{margin:4px 0 8px;font-size:17px}
  .bar{display:flex;gap:8px;margin-bottom:8px}
  button{flex:1;padding:12px;font-size:15px;border:0;border-radius:9px;background:#1668dc;color:#fff}
  button.gray{background:#6b7785}
  button:disabled{opacity:.45}
  .daybar{display:flex;align-items:center;gap:8px;font-size:13px;margin:2px 2px 8px;background:#fff;padding:8px 10px;border-radius:8px}
  .daybar input[type=date]{font-size:14px;padding:4px;border:1px solid #ccd;border-radius:6px}
  #prog{font-size:13px;color:#555;margin:2px}
  #env{font-size:10px;color:#999}
  .summary{font-size:12px;color:#444;background:#e8f0fe;border-radius:8px;padding:7px 10px;margin:6px 0}
  .summary b{color:#1668dc}
  .missing{color:#b3541e;font-size:11px;margin-top:3px;word-break:break-all}
  .card{background:#fff;border-radius:10px;padding:8px;margin:8px 0;box-shadow:0 1px 3px #0002;display:flex;gap:8px}
  .card img{width:88px;height:88px;object-fit:cover;border-radius:6px;flex:none;background:#dde}
  .info{flex:1;min-width:0}
  .car{font-size:16px;font-weight:700;color:#1668dc;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .car select{font-size:12px;padding:2px}
  .dt{font-size:11px;color:#888;margin:2px 0}
  .dt input{font-size:11px;padding:1px 3px;border:1px solid #ccc;border-radius:4px}
  table{width:100%;border-collapse:collapse;margin-top:3px;font-size:13px}
  td{padding:2px 3px}
  td.k{color:#555;width:42%}
  td.delta{font-size:10px;width:52px;color:#888}
  input{width:100%;padding:4px 5px;font-size:14px;border:1px solid #ccd;border-radius:4px}
  input.bad{border-color:#e22;background:#fff0f0}
  input.warn{border-color:#e80;background:#fff8e6}
  .flag{font-size:10px;margin-left:2px}
  .flag.r{color:#e22}.flag.y{color:#b8860b}
  .ms{font-size:10px;color:#aaa}
  details.raw summary{font-size:10px;color:#1668dc;margin-top:2px}
  details.raw div{font-size:9px;color:#777;white-space:pre-wrap;word-break:break-all;max-height:120px;overflow:auto;background:#f6f7f9;padding:4px;border-radius:4px}
  .foot{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:8px 10px;box-shadow:0 -1px 6px #0002;display:flex;gap:8px;z-index:10}
  .foot button{margin:0}
  .mask{position:fixed;inset:0;background:#0008;z-index:99;display:flex;align-items:center;justify-content:center;padding:16px}
  .mask .box{background:#fff;border-radius:12px;padding:14px;width:100%;max-width:420px;max-height:80vh;overflow:auto}
</style>
</head>
<body>
<h3>电客车能耗数据批量录入</h3>
<div class="daybar">
  录入日期 <input type="date" id="day">
  <button id="histbtn" style="flex:0 0 auto;padding:6px 12px;font-size:13px" class="gray">历史</button>
</div>
<div class="bar">
  <button id="pick">选择照片（可多选）</button>
  <button id="clear" class="gray" style="flex:0 0 30%">清空当前</button>
</div>
<input id="files" type="file" accept="image/*" multiple style="display:none">
<div id="prog">照片仅在本机识别，不会上传。首次加载模型约20MB。</div>
<div id="env"></div>
<div id="summary" class="summary" style="display:none"></div>
<div id="list"></div>
<div class="foot">
  <button id="csv" class="gray" style="flex:0 0 32%">导出CSV</button>
  <button id="copy" style="background:#0a8a52">复制当天列（0101-0167）</button>
</div>

<script type="importmap">
{ "imports": { "onnxruntime-web": "./ort.min.mjs" } }
</script>
<script type="module">
import { createPPOcrV5 } from "./ffocr.mjs";

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}

const FIELDS=[["牵引能耗","traction"],["再生能耗","regen"],["制动电阻能耗","resistor"],
              ["累计运行里程","mileage"],["辅助能耗","aux"]];
const CARS=Array.from({length:67},(_,i)=>"01"+String(i+1).padStart(2,"0"));
const LS_KEY="energy_v1";

// ---------- 本地历史库：{dates:{"2026-10-08":{"0101":{...值}}}} ----------
const store=JSON.parse(localStorage.getItem(LS_KEY)||'{"dates":{}}');
function save(){localStorage.setItem(LS_KEY,JSON.stringify(store));}
function putRec(date,car,vals){
  if(!date||!car)return;
  (store.dates[date]||(store.dates[date]={}))[car]=vals;
  save();renderSummary();
}
function prevRec(date,car){
  const days=Object.keys(store.dates).filter(d=>d<date&&store.dates[d][car]).sort();
  return days.length?{date:days[days.length-1],v:store.dates[days[days.length-1]][car]}:null;
}
const _d=new Date();
document.getElementById("day").value=`${_d.getFullYear()}-${String(_d.getMonth()+1).padStart(2,"0")}-${String(_d.getDate()).padStart(2,"0")}`;

const prog=document.getElementById("prog");
const ocr=createPPOcrV5({
  baseUrl:"./models",modelVariant:"mobile",
  detectionModelPath:"det_mobile.onnx",recognitionModelPath:"rec_mobile.onnx",
  dictionaryUrl:"./models/ppocrv5_dict.txt",
  wasmPaths:"./wasm/",cacheModels:true,providerPreference:"wasm",
  wasmThreads:self.crossOriginIsolated?Math.min(navigator.hardwareConcurrency||4,8):1,
});
document.getElementById("env").textContent=self.crossOriginIsolated
  ?"多核已启用（"+Math.min(navigator.hardwareConcurrency||4,8)+"线程）"
  :"首次加载后可添加到桌面，离线使用";

// ---------- 预处理：裁黑边+限长 ----------
async function preprocess(file){
  const bmp=await createImageBitmap(file);
  const c=document.createElement("canvas");
  c.width=bmp.width;c.height=bmp.height;
  const cc=c.getContext("2d");cc.drawImage(bmp,0,0);
  const W=c.width,H=c.height,step=Math.max(2,Math.round(Math.min(W,H)/400));
  const d=cc.getImageData(0,0,W,H).data;
  let x0=W,y0=H,x1=0,y1=0;
  for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step){
    const i=(y*W+x)*4;
    if(d[i]+d[i+1]+d[i+2]>120){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  }
  if(x1<=x0){x0=0;y0=0;x1=W;y1=H;}
  const m=Math.round(Math.min(W,H)*0.02);
  x0=Math.max(0,x0-m);y0=Math.max(0,y0-m);x1=Math.min(W,x1+m);y1=Math.min(H,y1+m);
  const cw=x1-x0,ch=y1-y0,MAX=2000,s=Math.min(1,MAX/Math.max(cw,ch));
  const out=document.createElement("canvas");
  out.width=Math.round(cw*s);out.height=Math.round(ch*s);
  out.getContext("2d").drawImage(c,x0,y0,cw,ch,0,0,out.width,out.height);
  return out;
}

// ---------- 标签模糊匹配（经5类屏幕真实样本调校） ----------
function labelMatch(key,t){
  // 真实错字样本：牵引能耗→常引8耗/泰引耗/牵引能毛/牵引彩耗
  if(key==="traction")return t.includes("引")&&(t.includes("耗")||t.includes("能"));
  if(key==="regen")return t.includes("再生");
  if(key==="resistor")return t.includes("制动")&&(t.includes("耗")||t.includes("能"));
  if(key==="mileage")return t.includes("运行")||t.includes("里程");
  // 辅助能耗→铺助能耗/请助能耗/精助配耗/助能耗
  if(key==="aux")return t.includes("助")&&(t.includes("耗")||t.includes("能"));
  return false;
}
function parseLines(rawLines){
  const lines=rawLines.filter(l=>l&&l.box&&l.box.points&&l.box.points[0]&&l.text);
  const L=lines.map(l=>{const ps=l.box.points;return{
    t:l.text.trim(),x0:Math.min(...ps.map(p=>p.x)),x1:Math.max(...ps.map(p=>p.x)),
    y:(ps[0].y+ps[2].y)/2,h:Math.max(8,ps[2].y-ps[0].y)};});
  const res={car:null,date:null};
  const nums=L.filter(l=>/^\d{5,8}$/.test(l.t.replace(/[oO]/g,"0")))
    .map(l=>({x0:l.x0,x1:l.x1,y:l.y,v:parseInt(l.t.replace(/[oO]/g,"0"))}));
  for(const[,key]of FIELDS){
    const lab=L.find(l=>labelMatch(key,l.t));
    if(!lab){res[key]=null;continue;}
    const c=nums.filter(n=>n.x0>lab.x0-5&&Math.abs(n.y-lab.y)<1.3*lab.h)
      .sort((a,b)=>Math.abs(a.y-lab.y)-Math.abs(b.y-lab.y)||(a.x0-lab.x1)-(b.x0-lab.x1));
    res[key]=c.length?c[0].v:null;
  }
  res.car=(L.map(l=>(l.t.match(/01\d{2}/)||[])[0]).find(Boolean))||null;
  const dt=(L.map(l=>(l.t.match(/20\d{2}[-/.]\d{1,2}[-/.]\d{1,2}/)||[])[0]).find(Boolean));
  if(dt){
    const parts=dt.replace(/[/.]/g,"-").split("-").map((p,i)=>i===0?p:p.padStart(2,"0"));
    // OCR常把年份末位认错（2026→2025）；识别成去年时纠正为今年（工具用于当日录入）
    const YEAR=new Date().getFullYear();
    if(parseInt(parts[0])===YEAR-1)parts[0]=String(YEAR);
    res.date=parts.join("-");
  }else res.date=null;
  res._raw=L.map(l=>`${Math.round(l.x0)},${Math.round(l.y)} ${l.t}`);
  return res;
}

// ---------- 校验 ----------
function checkVals(date,car,vals){
  const out={};
  const prev=date&&car?prevRec(date,car):null;
  for(const[,k]of FIELDS){
    let cls="",flag="";
    if(vals[k]!=null&&prev&&prev.v[k]!=null){
      const diff=vals[k]-prev.v[k];
      if(diff<0){cls="bad";flag=`↓较${prev.date.slice(5)}少${-diff}`;}
      else if(k==="mileage"&&diff>600){cls="warn";flag=`Δ${diff}偏大`;}
      else if(k==="mileage"){flag=`Δ${diff}km`;}
    }
    out[k]={cls,flag};
  }
  return out;
}

// ---------- 卡片渲染 ----------
const records=[]; // {url,date,car,vals:{...},raw}
let busy=false;
const listEl=document.getElementById("list");

function relocate(oldDate,oldCar,date,car){ // 改车号/日期时迁移记录
  if((oldDate===date&&oldCar===car)||!oldDate||!oldCar)return;
  if(store.dates[oldDate]&&store.dates[oldDate][oldCar]){
    const vals=store.dates[oldDate][oldCar];
    delete store.dates[oldDate][oldCar];save();
    if(date&&car){
      const b=store.dates[date]||(store.dates[date]={});
      b[car]=Object.assign({},b[car]||{},vals);save();
    }
  }
}
function renderCard(card,r){
  const oldDate=r.date,oldCar=r.car;
  const marks=checkVals(r.date,r.car,r);
  const nFilled=FIELDS.filter(([,k])=>r[k]!=null).length;
  const nBad=FIELDS.filter(([,k])=>marks[k].cls==="bad").length;
  card.innerHTML=`<img src="${r.url}"><div class="info">
    <div class="car">${r.car??'<span style="color:#e22;font-size:13px">车号未识别</span>'}
      <select class="carsel"><option value="">手动选择</option>
        ${CARS.map(c=>`<option ${c===r.car?"selected":""}>${c}</option>`).join("")}</select>
      ${nBad?`<span class="flag r">${nBad}项异常</span>`:""}
      ${nFilled<5?`<span class="flag y">缺${5-nFilled}项</span>`:""}</div>
    <div class="dt">日期 <input type="date" class="datesel" value="${r.date||""}"> · <span class="ms">${r.ms}秒</span></div>
    <table>${FIELDS.map(([n,k])=>`<tr><td class="k">${n}</td>
      <td><input data-k="${k}" value="${r[k]??""}" inputmode="numeric" class="${marks[k].cls}"></td>
      <td class="delta">${marks[k].flag?`<span class="flag ${marks[k].cls==="bad"?"r":"y"}">${marks[k].flag}</span>`:""}</td></tr>`).join("")}
    </table>
    <details class="raw"><summary>识别不对？展开（截图反馈）</summary><div>${(r._raw||[]).join("\n")}</div></details>
  </div>`;
  card.querySelector(".carsel").onchange=e=>{
    const od=r.date,oc=r.car;r.car=e.target.value||null;
    relocate(od,oc,r.date,r.car);sync(r);renderCard(card,r);};
  card.querySelector(".datesel").onchange=e=>{
    const od=r.date,oc=r.car;r.date=e.target.value||null;
    relocate(od,oc,r.date,r.car);sync(r);renderCard(card,r);renderSummary();};
  card.querySelectorAll("input[data-k]").forEach(inp=>inp.oninput=()=>{
    const v=inp.value.trim();r[inp.dataset.k]=v?parseInt(v):null;
    inp.className=/^\d{4,8}$/.test(v)?"":"bad";
    if(r.date&&r.car){ // 手动修改直接覆盖（允许把错误值改小）
      const vals={};for(const[,k]of FIELDS)vals[k]=r[k]??null;putRec(r.date,r.car,vals);
    }
  });
}
function mergeRec(date,car,vals){ // 识别落库：同车重复拍照时累计值取大
  if(!date||!car)return;
  const bucket=store.dates[date]||(store.dates[date]={});
  const old=bucket[car]||{};
  const merged={};
  for(const[,k]of FIELDS){
    const nv=vals[k];
    merged[k]=(nv!=null&&old[k]!=null)?Math.max(nv,old[k]):(nv??old[k]??null);
  }
  bucket[car]=merged;save();renderSummary();
}
function sync(r){
  if(r.date&&r.car){const v={};for(const[,k]of FIELDS)v[k]=r[k]??null;mergeRec(r.date,r.car,v);}
}

function renderSummary(){
  const date=document.getElementById("day").value;
  const day=store.dates[date]||{};
  const cars=Object.keys(day).sort();
  const el=document.getElementById("summary");
  if(!date){el.style.display="none";return;}
  const missing=CARS.filter(c=>!day[c]);
  let bad=0;
  for(const c of cars)for(const[,k]of FIELDS){
    const cur=day[c][k],p=prevRec(date,c);
    if(cur!=null&&p&&p.v[k]!=null&&cur<p.v[k])bad++;
  }
  el.style.display="block";
  el.innerHTML=`<b>${date}</b> 已录 <b>${cars.length}</b> 车 · 未录 ${missing.length} 车${bad?` · <span style="color:#e22">${bad}项累计值倒退</span>`:""}
    <div class="missing">未录车号：${missing.length?missing.join(" "):"全部录完"}</div>`;
}

async function run(files){
  if(busy)return;busy=true;
  document.getElementById("copy").disabled=true;
  for(let i=0;i<files.length;i++){
    const file=files[i];
    prog.textContent=`识别中 ${i+1}/${files.length} …`;
    const card=document.createElement("div");card.className="card";
    card.innerHTML=`<img src="${URL.createObjectURL(file)}"><div class="info"><div class="car">识别中…</div></div>`;
    listEl.appendChild(card);card.scrollIntoView({block:"end"});
    try{
      const cv=await preprocess(file);
      const t0=Date.now();
      const result=await ocr.ocr(cv);
      const ms=((Date.now()-t0)/1000).toFixed(1);
      const r=parseLines(result.lines);
      r.url=card.querySelector("img").src;r.ms=ms;
      r.date=r.date||document.getElementById("day").value;
      records.push(r);
      sync(r);
      renderCard(card,r);
    }catch(e){
      card.querySelector(".car").innerHTML='<span style="color:#e22;font-size:13px">识别失败：'+e.message+"</span>";
    }
  }
  prog.textContent=`完成，共 ${records.length} 张。核对后点底部复制。`;
  busy=false;document.getElementById("copy").disabled=false;renderSummary();
}

const picked=new Set();
document.getElementById("pick").onclick=()=>document.getElementById("files").click();
document.getElementById("files").onchange=e=>{
  const fresh=Array.from(e.target.files).filter(f=>{
    const k=f.name+f.size;if(picked.has(k))return false;picked.add(k);return true;});
  e.target.value="";if(fresh.length)run(fresh);
};
document.getElementById("clear").onclick=()=>{
  records.length=0;picked.clear();listEl.innerHTML="";
  prog.textContent="已清空当前照片（历史数据仍保留）。";
};
document.getElementById("day").onchange=renderSummary;

// ---------- 输出 ----------
function dayColumn(date){
  const day=store.dates[date]||{};const lines=[];
  for(const c of CARS)for(const[,k]of FIELDS)lines.push(day[c]&&day[c][k]!=null?day[c][k]:"");
  return lines;
}
async function copyText(text){
  try{await navigator.clipboard.writeText(text);return"clipboard";}catch(e){}
  return new Promise(resolve=>{
    const m=document.createElement("div");m.className="mask";
    m.innerHTML=`<div class="box"><div style="font-size:14px;margin-bottom:6px">长按文本框 → 全选 → 复制</div>
      <textarea style="width:100%;height:150px;font-size:12px;box-sizing:border-box;padding:6px"></textarea>
      <button id="cpok" style="width:100%;margin-top:8px;padding:10px">完成</button></div>`;
    document.body.appendChild(m);
    const ta=m.querySelector("textarea");ta.value=text;ta.focus();ta.select();
    let ok=false;try{ok=document.execCommand("copy");}catch(e){}
    m.querySelector("#cpok").onclick=()=>{m.remove();resolve(ok?"exec":"manual");};
  });
}
document.getElementById("copy").onclick=async()=>{
  const date=document.getElementById("day").value;
  if(!date){prog.textContent="请先选择录入日期";return;}
  const lines=dayColumn(date);
  const n=(store.dates[date]?Object.keys(store.dates[date]).length:0);
  const how=await copyText(lines.join("\n"));
  prog.textContent=`已生成335行（${n}车有数据）。${how==="manual"?"请长按全选复制，":""}在企微表点${date}列0101牵引格后粘贴。`;
};
document.getElementById("csv").onclick=()=>{
  const date=document.getElementById("day").value;
  const day=store.dates[date]||{};
  const rows=[["车号","项目","数值"]];
  for(const c of CARS)if(day[c])for(const[n,k]of FIELDS)rows.push([c,n,day[c][k]??""]);
  const blob=new Blob(["\ufeff"+rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`能耗数据_${date}.csv`;a.click();
};

// ---------- 历史弹层 ----------
document.getElementById("histbtn").onclick=()=>{
  const days=Object.keys(store.dates).sort().reverse();
  const m=document.createElement("div");m.className="mask";
  m.innerHTML=`<div class="box"><div style="font-size:15px;font-weight:700;margin-bottom:8px">历史记录</div>
    ${days.length?days.map(d=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #eee">
      <span>${d}（${Object.keys(store.dates[d]).length}车）</span>
      <span><button data-d="${d}" class="hl" style="width:auto;flex:0 0 auto;padding:4px 10px;font-size:12px;margin-right:6px">载入</button>
      <button data-d="${d}" class="hd gray" style="width:auto;flex:0 0 auto;padding:4px 10px;font-size:12px">删除</button></span></div>`).join("")
      :'<div style="color:#888;font-size:13px">暂无历史数据</div>'}
    <button id="hclose" style="width:100%;margin-top:10px">关闭</button></div>`;
  document.body.appendChild(m);
  m.querySelector("#hclose").onclick=()=>m.remove();
  m.querySelectorAll(".hl").forEach(b=>b.onclick=()=>{document.getElementById("day").value=b.dataset.d;renderSummary();m.remove();
    prog.textContent=`已切换到 ${b.dataset.d}，可直接复制该日数据。`;});
  m.querySelectorAll(".hd").forEach(b=>b.onclick=()=>{
    if(confirm("删除 "+b.dataset.d+" 的全部数据？")){delete store.dates[b.dataset.d];save();m.remove();renderSummary();}});
};

renderSummary();
</script>
</body>
</html>
